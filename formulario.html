<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Gerdson Luiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <a class="pular-link" href="#conteudo">Pular para o conteúdo</a>

    <header>
        <h1>Gerdson Luiz</h1>
        <nav aria-label="Menu principal">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
                <li><a href="multimidia.html">Mídias</a></li>
                <li><a href="formulario.html" aria-current="page">Formulário</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
            </ul>
        </nav>
        <button type="button" id="btn-tema" class="btn-tema">Tema escuro</button>
    </header>

    <main id="conteudo">
        <section>
            <article>
                <h2>Entre em Contato!</h2>
                <p>Preencha o formulário abaixo:</p>

                <form id="form-contato" action="#" method="POST" novalidate style="display: flex; flex-direction: column; gap: 1.2rem; margin-top: 1rem;">
                    <fieldset style="border: 1px solid #bae6fd; border-radius: 8px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem;">
                        <legend>Dados Pessoais</legend>
                        
                        <label for="nome">Nome Completo:</label>
                        <input class="form-control" type="text" id="nome" name="nome" required placeholder="Digite seu nome">

                        <label for="email">E-mail:</label>
                        <input class="form-control" type="email" id="email" name="email" required placeholder="exemplo@email.com">

                        <label for="tel">Telefone (Formato: 11 99999-9999):</label>
                        <input class="form-control" type="tel" id="tel" name="tel" pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" placeholder="11 99999-9999">

                        <label for="nasc">Data de Nascimento:</label>
                        <input class="form-control" type="date" id="nasc" name="nasc">

                        <label for="password">Senha:</label>
                        <input class="form-control" type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                    </fieldset>

                    <fieldset style="border: 1px solid #bae6fd; border-radius: 8px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem;">
                        <legend>Preferências e Mensagem</legend>

                        <label for="cor">Escolha uma cor:</label>
                        <input type="color" id="cor" name="cor" value="#0284c7">

                        <label for="mensagem">Mensagem:</label>
                        <textarea class="form-control" id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
                    </fieldset>

                    <button type="submit" class="btn btn-primary">Enviar Formulário</button>

                    <p id="mensagem-form" role="alert"></p>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; Gerdson Luiz - Trabalho para Entrega CP4, Universidade Braz Cubas. Todos os direitos reservados.</p>
    </footer>
    <script src="js/scripts.js"></script>
</body>

</html>
